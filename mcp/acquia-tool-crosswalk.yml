provider: Acquia
providerId: acquia
description: >-
  Binds every Acquia Source MCP tool to the Content API operation that backs it. The two surfaces sit
  on the same Source CMS site and share one OAuth server, but they are not mirrors of each other: the
  published REST contract is a generic JSON:API surface of 10 operations parameterised by entity type
  and bundle, while the MCP catalog is 38 task-shaped tools, most of which have no distinct REST
  operationId because they are the same JSON:API verbs pointed at a different entity type. Confidence
  is medium wherever the binding is a parameterisation rather than a distinct operation, and the
  Canvas, modeling and auto-save tools are mcp_only because Acquia publishes no REST equivalent.
surfaces:
  openapi:
    file: openapi/acquia-content-api-openapi.yaml
    source: https://dev.acquia.com/openapi/acquia-content-api.yaml
    operations: 10
    gated: false
    note: >-
      Published at a stable public URL, but its server is templated ({siteUrl}) — calling it needs a
      customer site and an OAuth token.
  mcp:
    url: '{DRUPAL_SITE_URL}/mcp'
    tools: 38
    gated: true
    note: >-
      Per-tenant endpoint behind OAuth; the live inputSchemas could not be introspected, so tools are
      mapped by Acquia's own published names and descriptions.
  graphql:
    present: false
    note: Acquia publishes no GraphQL surface for Source CMS; the content API is JSON:API 1.1.
