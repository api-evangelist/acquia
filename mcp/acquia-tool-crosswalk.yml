notes: >-
  The headline finding is the shape mismatch: 27 of 38 tools (71%) address surfaces — content
  modeling, Drupal Canvas, site configuration, the auto-save draft channel — that Acquia's published
  REST contract does not cover at all. An agent driving Acquia through MCP can do materially more
  than one driving it through the published Content API, and the MCP catalog is the only machine
  contract for those capabilities.
