rest_only:
  - operationId: issueToken
    reason: >-
      OAuth token issuance. The MCP client performs this outside the tool catalog, as part of
      connecting.
  - operationId: authorize
    reason: OAuth authorization-code redirect; a browser flow, not a tool.
  - operationId: apiRoot
    reason: >-
      GET /api resource-type index. The MCP equivalent is the drupal://content-types resource, not a
      tool.
  - operationId: getEntry
    reason: >-
      Single-entry read by UUID. MCP exposes reads through the drupal://entity/{entity_type_id}/{id}
      resource template rather than a tool.
  - operationId: deleteEntry
    reason: >-
      DELETE exists over REST for any bundle, but MCP ships only two delete tools (delete_menu_item,
      delete_canvas_page). Nodes, media and terms have no MCP delete — an agent-safety asymmetry
      worth noting.
