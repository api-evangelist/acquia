findings:
  agent_card: >-
    No A2A agent card on any host. Every /.well-known/agent-card.json and /.well-known/agent.json
    probe returned 404. No a2a/ artifact was written — per the pipeline contract an agent card is
    search-only and must never be authored on a provider's behalf.
  api_catalog: No RFC 9727 api-catalog document on any host.
  oauth_discovery: >-
    Acquia serves no OAuth authorization-server metadata on an acquia.com host. The Source CMS OAuth
    discovery documents Acquia's MCP reference describes
    (/.well-known/oauth-protected-resource, /.well-known/oauth-authorization-server, /.well-known/jwks.json)
    live on each CUSTOMER site, not on an Acquia-operated host, so they could not be probed here.
  identity_provider: >-
    accounts.acquia.com/.well-known/openid-configuration resolves to issuer
    https://id.acquia.com/oauth2/default — an Okta tenant. Supported grants include
    authorization_code, client_credentials, refresh_token, device_code and CIBA.
