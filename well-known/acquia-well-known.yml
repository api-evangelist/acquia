description: >-
  Probe of the five standard /.well-known/ paths across every Acquia host in this repo. Three real
  documents were served: a security.txt on www.acquia.com, a mirror of it on dev.acquia.com, and an
  OpenID Connect discovery document on accounts.acquia.com (which reveals Acquia's identity layer is
  Okta, issuer https://id.acquia.com/oauth2/default). Every other path returned 404, and on
  cloud.acquia.com, www.acquia.com, docs.acquia.com and dev.acquia.com the 404 came back as a full
  HTML page rather than a bare status — noted so that a later probe does not mistake the HTML body
  for a document.
