    endpoints that issue the tokens it accepts. Ten operations cover token issuance, the authorization
    redirect, the resource-type index, and JSON:API collection/entry/relationship reads and writes.
    The base URL is the customer's own site, so servers[] is templated on {siteUrl}; the per-bundle
    endpoint list is generated on each site at API > OpenAPI documentation.
