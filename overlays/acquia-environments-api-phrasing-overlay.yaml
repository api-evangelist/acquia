    x-apievangelist-phrasing:
      intent: List servers behind an environment
      effect: read
      questions:
      - Which servers power this environment and where are they?
      - Can I filter an environment's servers by region or status?
      instructions:
      - text: List the servers for environment {env}.
        slots:
          env: path.environmentId
      - text: Find servers in environment {env} matching {filter}.
        slots:
          env: path.environmentId
          filter: query.filter
      method: generated
      generated: '2026-09-26'
