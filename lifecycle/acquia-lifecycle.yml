  scope: Fully managed Drupal hosting (Cloud Platform)
  source: https://www.acquia.com/ (product positioning); contractual SLA terms are per subscription.
  note: >-
    The 99.95% figure is published marketing copy for the hosting product, not an API availability
    SLA. Acquia does not publish an availability target for the Cloud Platform API itself.
