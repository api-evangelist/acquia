content_api:
  file: openapi/acquia-content-api-openapi.yaml
  model: JSON:API 1.1 resource objects
  fixed_entity_graph: false
  note: The Content API has NO fixed entity model in its published contract. Its paths are /api/{entityType}/{bundle}[/{uuid}],
    parameterised over whatever content types a site defines, and the concrete graph is generated per
    site (API > OpenAPI documentation). The published schemas are the JSON:API envelope shapes - ResourceObject,
    CollectionDocument, EntityDocument, ErrorDocument - not domain entities. Relationships travel in data.relationships
    and are traversable at /api/{entityType}/{bundle}/{uuid}/relationships/{field}.
  entity_types_addressable:
  - node
  - media
  - taxonomy_term
  - user
  - canvas_page
  entity_types_source: the list_entities MCP tool, which names the entity types the platform exposes
  envelope_schemas:
  - ResourceObject
  - CollectionDocument
  - EntityDocument
  - ErrorDocument
notes: The Private Network Service API uses an entirely different schema naming convention (Private_Network_Service_API_*)
  and its own response wrappers rather than HAL - it is a separately built service folded into the same
  portal, and it is excluded from the graph above rather than merged into it.
